name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
  node-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18.20.8
          cache: npm
      - run: npm ci
      - run: npm run check
  typescript-5-0:
    name: TypeScript 5.0 declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18.20.8
          cache: npm
      - run: npm ci
      - run: npx --yes --package=typescript@5.0.4 --call 'tsc --version && tsc -p type-tests/tsconfig.minimum.json'
  match-vision:
    name: Packed Match Vision consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: sdk
      - uses: actions/checkout@v6
        with:
          repository: W3Booster/app-match-vision
          path: app
      - uses: actions/setup-node@v6
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: mkdir -p ../app/.sdk-pack && npm pack --pack-destination ../app/.sdk-pack
        working-directory: sdk
      # Resolve the packed dependency before installing the consumer tree. Replacing
      # it after npm ci triggers npm's edgesOut failure with the Angular peer graph.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund ./.sdk-pack/*.tgz
        working-directory: app
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
