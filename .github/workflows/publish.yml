name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11
      - name: Verify OIDC release environment
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          npm --version
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          node -e 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== "v" + version) { console.error("Tag does not match package version " + version); process.exit(1); }'
      - name: Publish package
        run: npm publish --access public
